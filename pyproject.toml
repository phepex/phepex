[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "phepex"
# Version is derived from git tags by setuptools-scm (see [tool.scikit-build.metadata.version]);
# tag a release `vX.Y.Z`. Do not hard-code a version here.
dynamic = ["version"]
description = "Photo-electron pulse extraction: fast PMT/SiPM waveform charge & timing extraction for Python."
readme = "README.pypi.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy"]
authors = [
  { name = "Felix Werner", email = "felix.werner@mpi-hd.mpg.de" },
  { name = "Max-Planck-Institut für Kernphysik" },
]
keywords = ["waveform", "charge-extraction", "PMT", "SiPM", "Cherenkov", "signal-processing", "DSP"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/phepex/phepex"
Documentation = "https://phepex.github.io/phepex"
Repository = "https://github.com/phepex/phepex"
Issues = "https://github.com/phepex/phepex/issues"

[project.optional-dependencies]
# Extras used by the comparative benchmark + validation tests (ctapipe pulls numba/scipy/astropy).
bench = ["ctapipe>=0.31"]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/phepex"]

# Keep dev/CI-only files out of the published sdist (scikit-build-core otherwise
# ships every git-tracked file).
sdist.exclude = [
  ".devcontainer",
  ".github",
  ".pre-commit-config.yaml",
  ".clang-format",
]

# Single-source the version from git tags (setuptools-scm). Building from a checkout reads
# the tag; building from an sdist reads the version baked into PKG-INFO.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

# nanobind's STABLE_ABI only produces a limited-API module on CPython >=3.12; tag those wheels
# abi3 (cp312) so one wheel installs on 3.12/3.13/3.14+. 3.10/3.11 stay version-specific.
# abi-flags = "" excludes free-threaded builds (3.13t), where the stable ABI is unavailable.
[[tool.scikit-build.overrides]]
if.python-version = ">=3.12"
if.abi-flags = ""
wheel.py-api = "cp312"

[tool.scikit-build.cmake]
build-type = "Release"

[tool.scikit-build.cmake.define]
PHEPEX_BUILD_PYTHON = "ON"

# Presence of this table enables setuptools-scm (git-tag versioning).
[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["phepex"]

[tool.ruff.lint.per-file-ignores]
# Benchmarks/tests prepend the benchmarks dir to sys.path before importing
# generate_events, so those imports intentionally follow runtime setup.
"tests/*" = ["E402"]
"benchmarks/*" = ["E402"]
