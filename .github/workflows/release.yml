name: release

# Publish phepex to PyPI (on a published GitHub Release) or TestPyPI (manual dry-run) using
# PyPI Trusted Publishing (OIDC) — no API tokens are stored anywhere.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to TestPyPI instead of PyPI"
        type: boolean
        default: true

jobs:
  # Build the exact wheels + sdist we will publish (one source of truth for the matrix).
  build:
    uses: ./.github/workflows/wheels.yml

  publish_testpypi:
    name: publish to TestPyPI
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # OIDC — the only added permission
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: publish to PyPI
    needs: [build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC — the only added permission
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
