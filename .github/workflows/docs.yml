name: docs

# Build the unified C++/Python API documentation and publish it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs superseded by newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen graphviz

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install phepex (with ctapipe extra for the extractor autodoc)
        run: pip install .[bench]

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Build the documentation
        run: sphinx-build -b html docs docs/_build/html -W --keep-going

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
